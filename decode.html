<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LSB 图片解码器</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            padding: 30px;
            max-width: 500px;
            width: 100%;
        }

        h1 {
            text-align: center;
            color: #1a73e8;
            font-size: 24px;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            font-size: 14px;
            margin-bottom: 24px;
        }

        .upload-area {
            border: 2px dashed #ccc;
            border-radius: 12px;
            padding: 40px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            background: #fafafa;
            margin-bottom: 20px;
        }

        .upload-area:hover,
        .upload-area.dragover {
            border-color: #1a73e8;
            background: #e8f0fe;
        }

        .upload-area svg {
            width: 48px;
            height: 48px;
            fill: #999;
            margin-bottom: 12px;
        }

        .upload-area p {
            color: #666;
            font-size: 15px;
        }

        .upload-area .hint {
            font-size: 12px;
            color: #999;
            margin-top: 8px;
        }

        .upload-area.has-image {
            border-color: #34a853;
            background: #e6f4ea;
        }

        .preview {
            display: none;
            margin-bottom: 20px;
            text-align: center;
        }

        .preview img {
            max-width: 100%;
            max-height: 300px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .preview .filename {
            margin-top: 8px;
            font-size: 13px;
            color: #666;
        }

        .btn {
            width: 100%;
            padding: 14px;
            background: #1a73e8;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
            display: none;
        }

        .btn:hover {
            background: #1557b0;
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .result {
            display: none;
            margin-top: 20px;
            padding: 16px;
            border-radius: 8px;
            background: #e6f4ea;
            border: 1px solid #34a853;
        }

        .result.error {
            background: #fce8e6;
            border-color: #ea4335;
        }

        .result-label {
            font-size: 13px;
            color: #333;
            margin-bottom: 6px;
        }

        .result-content {
            font-size: 20px;
            font-weight: bold;
            color: #1a73e8;
            word-break: break-all;
            font-family: 'Courier New', monospace;
            background: white;
            padding: 12px;
            border-radius: 6px;
            border: 1px solid #ddd;
        }

        .copy-btn {
            margin-top: 10px;
            padding: 8px 16px;
            background: #34a853;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
        }

        .copy-btn:hover {
            background: #2d9249;
        }

        .footer {
            text-align: center;
            margin-top: 20px;
            font-size: 12px;
            color: #999;
        }

        input[type="file"] {
            display: none;
        }

        .loading {
            display: none;
            text-align: center;
            margin: 15px 0;
        }

        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #1a73e8;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>🔓 LSB 图片解码器</h1>
        <p class="subtitle">从 PNG 图片中提取隐藏的密码</p>

        <div class="upload-area" id="uploadArea" onclick="document.getElementById('fileInput').click()">
            <svg viewBox="0 0 24 24">
                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8l-6-6zM6 20V4h7v5h5v11H6z" />
            </svg>
            <p>点击选择图片</p>
            <p class="hint">支持 PNG / BMP 格式</p>
        </div>

        <input type="file" id="fileInput" accept="image/png,image/bmp,image/jpeg" onchange="handleFile(this.files[0])">

        <div class="preview" id="preview">
            <img id="previewImg" src="" alt="预览">
            <div class="filename" id="fileName"></div>
        </div>

        <div class="loading" id="loading">
            <div class="spinner"></div>
        </div>

        <button class="btn" id="decodeBtn" onclick="decodeImage()">🔍 提取密码</button>

        <div class="result" id="result">
            <div class="result-label">✅ 提取的密码：</div>
            <div class="result-content" id="resultContent"></div>
            <button class="copy-btn" onclick="copyResult()">📋 复制密码</button>
        </div>

        <div class="footer">纯本地运行，图片不上传服务器</div>
    </div>

    <script>
        let currentFile = null;
        let currentImageData = null;

        function handleFile(file) {
            if (!file) return;
            currentFile = file;

            const reader = new FileReader();
            reader.onload = function (e) {
                const img = document.getElementById('previewImg');
                img.src = e.target.result;
                document.getElementById('preview').style.display = 'block';
                document.getElementById('fileName').textContent = file.name + ' (' + (file.size / 1024).toFixed(1) + ' KB)';
                document.getElementById('uploadArea').classList.add('has-image');
                document.getElementById('uploadArea').querySelector('p').textContent = '已选择: ' + file.name;
                document.getElementById('decodeBtn').style.display = 'block';
                document.getElementById('result').style.display = 'none';
                currentImageData = null;
            };
            reader.readAsDataURL(file);
        }

        // 拖拽支持
        const uploadArea = document.getElementById('uploadArea');
        uploadArea.addEventListener('dragover', function (e) {
            e.preventDefault();
            this.classList.add('dragover');
        });
        uploadArea.addEventListener('dragleave', function (e) {
            e.preventDefault();
            this.classList.remove('dragover');
        });
        uploadArea.addEventListener('drop', function (e) {
            e.preventDefault();
            this.classList.remove('dragover');
            const files = e.dataTransfer.files;
            if (files.length > 0) {
                handleFile(files[0]);
                document.getElementById('fileInput').files = files;
            }
        });

        function decodeImage() {
            if (!currentFile) return;

            document.getElementById('loading').style.display = 'block';
            document.getElementById('decodeBtn').disabled = true;
            document.getElementById('result').style.display = 'none';

            setTimeout(function () {
                try {
                    const reader = new FileReader();
                    reader.onload = function (e) {
                        const img = new Image();
                        img.onload = function () {
                            try {
                                // 创建 canvas 获取像素数据
                                const canvas = document.createElement('canvas');
                                canvas.width = img.width;
                                canvas.height = img.height;
                                const ctx = canvas.getContext('2d');
                                ctx.drawImage(img, 0, 0);
                                const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                                const pixels = imageData.data;

                                // 提取 LSB
                                let bits = '';
                                for (let i = 0; i < pixels.length; i++) {
                                    bits += (pixels[i] & 1).toString();
                                }

                                // 查找结束标记 0xFFFE (1111111111111110)
                                const endMarker = '1111111111111110';
                                const endPos = bits.indexOf(endMarker);

                                if (endPos === -1) {
                                    showResult('⚠️ 未在图片中发现隐藏内容', true);
                                    return;
                                }

                                const validBits = bits.substring(0, endPos);

                                // 每 8 位转字节
                                const bytes = [];
                                for (let i = 0; i < validBits.length; i += 8) {
                                    if (i + 8 <= validBits.length) {
                                        const byte = parseInt(validBits.substring(i, i + 8), 2);
                                        bytes.push(byte);
                                    }
                                }

                                // UTF-8 解码
                                try {
                                    const decoder = new TextDecoder('utf-8');
                                    const uint8Array = new Uint8Array(bytes);
                                    const text = decoder.decode(uint8Array);
                                    if (text.trim()) {
                                        showResult(text, false);
                                    } else {
                                        showResult('⚠️ 提取的内容为空', true);
                                    }
                                } catch (decodeErr) {
                                    showResult('⚠️ 解码失败：内容可能不是 UTF-8 编码', true);
                                }

                            } catch (err) {
                                showResult('❌ 处理图片时出错：' + err.message, true);
                            }
                        };
                        img.onerror = function () {
                            showResult('❌ 图片加载失败，请确认文件是否完整', true);
                        };
                        img.src = e.target.result;
                    };
                    reader.readAsDataURL(currentFile);
                } catch (err) {
                    showResult('❌ 读取文件失败：' + err.message, true);
                }
            }, 100);
        }

        function showResult(content, isError) {
            document.getElementById('loading').style.display = 'none';
            document.getElementById('decodeBtn').disabled = false;
            const resultDiv = document.getElementById('result');
            resultDiv.style.display = 'block';
            resultDiv.className = 'result' + (isError ? ' error' : '');
            document.getElementById('resultContent').textContent = content;
        }

        function copyResult() {
            const text = document.getElementById('resultContent').textContent;
            navigator.clipboard.writeText(text).then(function () {
                const btn = document.querySelector('.copy-btn');
                btn.textContent = '✅ 已复制';
                setTimeout(function () { btn.textContent = '📋 复制密码'; }, 2000);
            }).catch(function () {
                alert('复制失败，请手动复制');
            });
        }
    </script>
</body>

</html>
